name: Generate contribution snake

on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - uses: Platane/snk/svg-only@v3
        with:
          github_user_name: Furiousdem
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#ff3347
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#00bfff
      - uses: crazy-max/ghaction-github-pages@v4
        with:
          build_dir: dist
          branch: output
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
